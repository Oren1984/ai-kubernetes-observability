# Identity used by the incident-intelligence engine and dashboard.
# Read-only, namespaced to the demo workload: it cannot change anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evidence-reader
  namespace: aiobs-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evidence-reader
  namespace: aiobs-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evidence-reader
  namespace: aiobs-demo
subjects:
  - kind: ServiceAccount
    name: evidence-reader
    namespace: aiobs-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evidence-reader
