# In-cluster OpenTelemetry Collector. Its configuration lives in
# observability/otel-collector.yaml and is loaded into the `otel-collector-config`
# ConfigMap by scripts/start.ps1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: aiobs-observability
---
# Read-only cluster access needed by the k8s_attributes processor and the
# kubelet_stats / k8s_cluster / k8s_objects receivers. No write verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiobs-otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, events, services, replicationcontrollers, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [""]
    # nodes/stats: kubelet resource usage. nodes/pods: the kubelet's pod list,
    # needed for the *_limit_utilization metrics. Deliberately not nodes/proxy,
    # which would open the whole kubelet API.
    resources: [nodes/stats, nodes/pods]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiobs-otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: aiobs-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiobs-otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: aiobs-observability
  labels:
    app: otel-collector
spec:
  replicas: 1 # single-node cluster: one instance covers the only kubelet
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.162.0
          args: ["--config=/etc/otelcol/otel-collector.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          env:
            - name: K8S_NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: GOMEMLIMIT
              value: 256MiB
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 320Mi}
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: aiobs-observability
spec:
  selector:
    app: otel-collector
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
