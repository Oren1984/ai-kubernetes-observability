# Project-owned single-node cluster. Everything is bound to 127.0.0.1.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aiobs
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 16443
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      # demo-api NodePort -> http://127.0.0.1:18080
      - containerPort: 30080
        hostPort: 18080
        listenAddress: "127.0.0.1"
        protocol: TCP
