apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-workload
  namespace: aiobs-demo
automountServiceAccountToken: false # the workloads never talk to the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: aiobs-demo
  labels:
    app: demo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      serviceAccountName: demo-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-api
          image: aiobs/demo-api:dev
          imagePullPolicy: Never # loaded into the node by `kind load`
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: otel-env
          env:
            - name: FAULT_INJECTION_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: demo-api
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=aiobs,service.version=0.1.0,service.instance.id=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME)"
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            # The memory limit is what bounds Scenario C.
            limits: {cpu: 500m, memory: 192Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: aiobs-demo
  labels:
    app: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      serviceAccountName: demo-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic-generator
          image: aiobs/demo-api:dev
          imagePullPolicy: Never
          command: ["python", "loadgen.py"]
          envFrom:
            - configMapRef:
                name: otel-env
          env:
            - name: TARGET_URL
              value: "http://demo-api:8000/api/work"
            - name: REQUESTS_PER_SECOND
              value: "2"
            - name: OTEL_SERVICE_NAME
              value: traffic-generator
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=aiobs,service.version=0.1.0,service.instance.id=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME)"
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
