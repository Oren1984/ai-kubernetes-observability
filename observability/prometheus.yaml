# Prometheus receives all workload metrics over OTLP from the Collector
# (--web.enable-otlp-receiver). It scrapes nothing in the cluster itself.
global:
  scrape_interval: 15s

otlp:
  # Resource attributes copied onto every series so metrics can be joined with
  # logs and traces by the same service / Kubernetes identity.
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.instance.id
    - k8s.cluster.name
    - k8s.namespace.name
    - k8s.deployment.name
    - k8s.pod.name
    - k8s.container.name
    - k8s.node.name
    - k8s.container.status.last_terminated_reason
  translation_strategy: UnderscoreEscapingWithSuffixes

storage:
  tsdb:
    out_of_order_time_window: 5m

scrape_configs:
  # Backend self-metrics only: storage and ingestion figures for the FinOps view.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: loki
    static_configs:
      - targets: ["aiobs-loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["aiobs-tempo:3200"]
